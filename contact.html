<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <h2>Contact Me</h2>
    <form action=""></form>
    <div>
        <label for="name"><strong>Name:</strong></label>
        <input type="text" placeholder="Enter your name" name="myname" id="name">
    </div>
    <br>
    <div>
        <label for="email"><strong>Email:</strong></label>
        <input type="text" placeholder="Enter your email" name="myemail" id="email">
    </div>
    <br>
    <div>
        <label for="message"><strong>Message:</strong></label>
     <br><textarea name="mymessage" placeholder="Enter your message"  id="message" cols="20" rows="10"></textarea>
    </div>
    <br>
    <div>
        <input type="submit" value="Submit Now">
    </div>
</body>
</html>
